# Прод-сервер: образ собирается CI вашего репозитория и пушится в GHCR.
# Репозиторий: https://github.com/rvcelsiorrv/superzvonilka
# Образ после успешного CI: ghcr.io/rvcelsiorrv/superzvonilka:latest
# (то же имя даёт workflow из ${{ github.repository }} — менять compose при смене только вилки не нужно.)
#
# Скопируйте на сервер как docker-compose.yml, рядом положите боевой .env (не коммитьте в git).
# Задайте PORT в .env или в окружении хоста.

services:
  mirotalk:
    image: ghcr.io/rvcelsiorrv/superzvonilka:latest
    container_name: mirotalk
    hostname: mirotalk
    restart: unless-stopped
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - ./.env:/src/.env:ro
