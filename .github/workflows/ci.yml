name: CI

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # LTS

      - name: Install dependencies
        run: npm install

      - name: Create config from template
        run: cp app/src/config.template.js app/src/config.js

      - name: Run unit tests
        run: npm test

  build:
    runs-on: ubuntu-22.04 # LTS
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker image name (GHCR must be lowercase)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Optional: Portainer → Stack → Webhooks → copy URL into repo secret PORTAINER_WEBHOOK_URL
      - name: Trigger Portainer redeploy webhook (optional)
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
